<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070a11" />
    <meta
      name="description"
      content="Touch a 3D object made of water, ocean, slime or fur and watch it react."
    />
    <title>Substance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <canvas
      id="stage"
      aria-label="Interactive 3D object. Drag on it to touch it, drag the background to spin it."
    ></canvas>

    <header class="top" id="top">
      <div class="top-left">
        <div class="brand"><span class="mark" aria-hidden="true"></span>Substance</div>
        <div class="readout" id="readout"><b>Water</b><br />n = 1.333<br />997 kg/m³</div>
      </div>
      <nav class="shapes" role="radiogroup" aria-label="Shape">
        <button type="button" id="shape-orb" role="radio" aria-checked="true" data-shape="orb">
          <span class="glyph glyph-orb"></span>Orb
        </button>
        <button type="button" id="shape-cube" role="radio" aria-checked="false" data-shape="cube">
          <span class="glyph glyph-cube"></span>Cube
        </button>
      </nav>
    </header>

    <div class="dock" id="dock">
      <p class="hint" id="hint" aria-live="polite">Tap for ripples. Drag to stir the surface.</p>
      <nav class="picker" role="radiogroup" aria-label="Orb material">
        <button type="button" id="mat-water" role="radio" aria-checked="true" data-mat="water">
          <span class="sw sw-water"></span>Water
        </button>
        <button type="button" id="mat-ocean" role="radio" aria-checked="false" data-mat="ocean">
          <span class="sw sw-ocean"></span>Ocean
        </button>
        <button type="button" id="mat-slime" role="radio" aria-checked="false" data-mat="slime">
          <span class="sw sw-slime"></span>Slime
        </button>
        <button type="button" id="mat-fur" role="radio" aria-checked="false" data-mat="fur">
          <span class="sw sw-fur"></span>Hairy
        </button>
      </nav>
      <p class="sub" id="sub">Drag the background to spin</p>
    </div>

    <div class="fallback" id="fallback" hidden>
      Substance needs WebGL 2. Try a recent version of Safari, Chrome or Firefox.
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
